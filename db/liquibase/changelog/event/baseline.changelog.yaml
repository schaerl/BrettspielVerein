databaseChangeLog:
- changeSet:
    id: "event-0"
    author: schaerl
    comment: Baseline for Events
    changes:
    - createTable:
        columns:
        - column:
            autoIncrement: true
            constraints:
              nullable: false
              primaryKey: true
            name: id
            type: INT
        - column:
            constraints:
              nullable: false
            name: event_type
            type: INT
        - column:
            constraints:
              nullable: false
            name: date
            type: date
        - column:
            constraints:
              nullable: false
            name: start_time
            type: time
        - column:
            constraints:
              nullable: false
            name: location
            type: VARCHAR(128)
        tableName: event
    - createTable:
        columns:
        - column:
            autoIncrement: true
            constraints:
              nullable: false
              primaryKey: true
            name: id
            type: INT
        - column:
            constraints:
              nullable: false
              unique: true
            name: name
            type: VARCHAR(64)
        - column:
            constraints:
              nullable: false
            name: price
            type: INT
        tableName: event_type
    - addForeignKeyConstraint:
        baseColumnNames: event_type
        baseTableName: event
        constraintName: event_type_fk
        deferrable: false
        initiallyDeferred: false
        onDelete: RESTRICT
        onUpdate: RESTRICT
        referencedColumnNames: id
        referencedTableName: event_type
        validate: true

- changeSet:
    id: 'event-data-4'
    author: schaerl
    comment: Vereinsmarkt
    changes:
    -  insert:
        tableName:  event
        columns:
        -  column:
            name:  event_type
            valueComputed: "(Select id from event_type where name = 'Vereinsmarkt')"
        -  column:
            name: date
            value:  '2025-06-14'
        -  column:
            name: start_time
            value:  '08:30:00'
        - column:
            name: location
            value: 'Altstadt, 4800 Zofingen'

- changeSet:
    id: 'table-update-event-add-extras'
    author: schaerl
    comment: This adds the column 'extras' to the table. It can contain extra information to be displayed.
    changes:
        - addColumn:
            tableName: event
            columns:
                - column:
                      name: extra
                      type: VARCHAR(1024)

