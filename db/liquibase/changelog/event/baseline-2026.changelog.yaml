- changeSet:
    id: 'event-data-sommer-grill-2026'
    author: schaerl
    comment: Information Grillen vor dem Brettspielabend
    changes:
    - update:
        tableName: event
        columns:
        - column:
            name: extra
            value: An diesem Abend werden wir bei schönem Wetter grillen! In diesem Fall kann man bereits ab 18:00 Uhr kommen. Salat und Brot werden bereitgestellt, Grillgut bitte selber mitbringen. Die Entscheidung zur Durchführung wird im Gruppenchat am 26. Juni um 16:00 angekündigt. Beitreten kann man mit dem QR Code weiter oben auf der Seite. Bei schlechtem Wetter werden wir es im Juli versuchen.
        where: date='2026-06-26'
